<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuadrante VMC</title>
  <meta name="theme-color" content="#eef1f8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <span class="logo">VMC</span>
      <span class="brand-text">Cuadrante <small id="congregacion"></small></span>
    </div>
    <nav id="tabs">
      <button data-vista="cuadrante">Cuadrante</button>
      <button data-vista="publicadores">Publicadores</button>
      <button data-vista="historial">Historial</button>
      <button data-vista="estadisticas">Estadísticas</button>
      <button data-vista="imprimir">Imprimir</button>
      <button data-vista="ajustes">Ajustes</button>
    </nav>
    <button id="deshacer" class="deshacer" data-act="deshacer" hidden title="Deshacer el último cambio (Ctrl+Z)">↶ Deshacer</button>
    <button id="sync" class="sync" hidden></button>
  </header>
  <div id="aviso" class="aviso no-print" hidden></div>
  <main id="main"></main>
  <dialog id="dlg"><div id="dlg-body"></div></dialog>
  <script src="guia.js?v=14"></script>
  <script src="drive.js?v=14"></script>
  <script src="stats.js?v=14"></script>
  <script src="extra.js?v=14"></script>
  <script src="historial.js?v=14"></script>
  <script src="app.js?v=14"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  </script>
</body>
</html>
